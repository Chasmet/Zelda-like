name: Patch V6.1 World Test

on:
  push:
    branches: ["v6.1-physics-world"]

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v6.1-physics-world
      - name: Count all physical hand-authored decor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci_v61_world_check.gd')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          skip = 0
          inserted = False
          for line in lines:
              if skip:
                  skip -= 1
                  continue
              if line == '\tvar handmade_count := 0':
                  output.append('\tvar handmade_count := _count_static_decor(game)')
                  skip = 4
                  continue
              if line == 'func _count_nodes_named(root: Node, target_name: String) -> int:' and not inserted:
                  output.extend([
                      'func _count_static_decor(root: Node) -> int:',
                      '\tvar count := 0',
                      '\tif root is StaticBody3D:',
                      '\t\tvar root_name := String(root.name)',
                      '\t\tif root_name not in ["SupercontinentTerrainV61", "OceanSeabed", "OceanBoundaryWest", "OceanBoundaryEast", "OceanBoundaryNorth", "OceanBoundarySouth"]:',
                      '\t\t\tcount = 1',
                      '\tfor child: Node in root.get_children():',
                      '\t\tcount += _count_static_decor(child)',
                      '\treturn count',
                      '',
                      '',
                  ])
                  inserted = True
              output.append(line)
          if not inserted:
              raise SystemExit('helper insertion marker not found')
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci_v61_world_check.gd
          git commit -m "Count V6.1 physical manual decor correctly"
          git push origin HEAD:v6.1-physics-world
