name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  export-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Godot 4.7.1 for validation
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import project and validate scripts
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script|GDScript backtrace" godot-import.log

      - name: Launch gameplay smoke test
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 20 2>&1 | tee godot-runtime.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid get index|Invalid set index|Failed to load script|GDScript backtrace|Condition \"!is_inside_tree\(\)\"" godot-runtime.log

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Godot project
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          export_debug: true
          use_preset_export_path: true
          presets_to_export: Android
          cache: true

      - name: Verify APK exists
        run: |
          find build -type f -name "*.apk" -print
          test -n "$(find build -type f -name '*.apk' -print -quit)"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Godot-RPG3D-validation-logs
          path: |
            godot-import.log
            godot-runtime.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: Skypiea-RPG3D-Android-debug
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 30
