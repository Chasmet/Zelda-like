name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "agent/**", "work/**"]
  pull_request:
    branches: [main]

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository and large assets
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install Blender and visual-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb ffmpeg
          blender --version
          blender --background --python-expr "import numpy; print('NumPy', numpy.__version__)"

      - name: Generate detailed 3D models with Blender
        run: |
          rm -rf generated_models
          blender --background --python tools/blender/generate_game_assets_v2.py -- --output generated_models
          find generated_models -maxdepth 1 -type f -name '*.glb' -printf '%f  %s bytes\n' | sort
          test "$(find generated_models -maxdepth 1 -type f -name '*.glb' | wc -l)" -eq 12
          test -s generated_models/hero_knight.glb

      - name: Download Godot for runtime validation
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project and test startup
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit
          set +e
          timeout 45s "$GODOT" --headless --path . --quit-after 20 > /tmp/godot-runtime.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed|ERROR:.*main_hud_final" /tmp/godot-runtime.log; then
            echo "Godot runtime error detected"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "Godot exited unexpectedly with status $STATUS"
            exit "$STATUS"
          fi

      - name: Render visual HUD validation
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          mkdir -p build/validation
          set +e
          timeout 55s xvfb-run -a "$GODOT" --path . --write-movie build/validation/gameplay.avi --fixed-fps 30 --quit-after 480 > /tmp/godot-visual.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/godot-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed" /tmp/godot-visual.log; then
            exit 1
          fi
          test -s build/validation/gameplay.avi
          ffmpeg -y -sseof -1 -i build/validation/gameplay.avi -frames:v 1 build/validation/HUD-Carte-Portrait.png
          test -s build/validation/HUD-Carte-Portrait.png
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Godot project
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          export_debug: true
          use_preset_export_path: true
          presets_to_export: Android
          cache: true

      - name: Verify and normalise APK
        run: |
          APK_PATH="$(find build -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          echo "Found APK at $APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          unzip -l "$APK_PATH" | grep -q 'classes.dex'
          unzip -l "$APK_PATH" | grep -q 'lib/arm64-v8a/libgodot_android.so'
          unzip -l "$APK_PATH" | grep -q 'assets/carte monde.png'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/main_hud_final.gdc'
          mkdir -p build/final
          TARGET="build/final/ZeldaLike-Carte-Portrait-debug.apk"
          if [ "$(realpath "$APK_PATH")" != "$(realpath -m "$TARGET")" ]; then
            cp "$APK_PATH" "$TARGET"
          fi
          test -s "$TARGET"
          sha256sum "$TARGET" | tee build/final/SHA256.txt
          ls -lh "$TARGET"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: ZeldaLike-Carte-Portrait-Android
          path: |
            build/final/ZeldaLike-Carte-Portrait-debug.apk
            build/final/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload visual validation
        uses: actions/upload-artifact@v7
        with:
          name: ZeldaLike-HUD-Visual-Validation
          path: build/validation/HUD-Carte-Portrait.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated Blender models
        uses: actions/upload-artifact@v7
        with:
          name: ZeldaLike-detailed-3D-models
          path: generated_models/*.glb
          if-no-files-found: error
          retention-days: 30
