name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "agent/**", "work/**"]
  pull_request:
    branches: [main]

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository and large assets
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install Blender and visual-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb ffmpeg
          blender --version

      - name: Generate the articulated Cheikh hero and game models
        run: |
          rm -rf generated_models
          blender --background --python tools/blender/generate_game_assets_v2.py -- --output generated_models
          find generated_models -maxdepth 1 -type f -name '*.glb' -printf '%f  %s bytes\n' | sort
          test "$(find generated_models -maxdepth 1 -type f -name '*.glb' | wc -l)" -eq 12
          test -s generated_models/hero_knight.glb

      - name: Download Godot for runtime validation
        run: |
          rm -rf /tmp/godot /tmp/godot.zip
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project and reject script errors
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --import
          set +e
          timeout 60s "$GODOT" --headless --path . --quit-after 25 > /tmp/godot-runtime.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed|ERROR:.*main_mobile_final|ERROR:.*main_visual_overhaul_v6|ERROR:.*main_coastal_presentation_v7|ERROR:.*main_critical_fixes_v8|ERROR:.*main_water_portrait_polish_v8_1|ERROR:.*main_portrait_front_v8_2|ERROR:.*main_mobile_ui_polish_v8_3|ERROR:.*main_spawn_safety_v8_4|ERROR:.*procedural_animator" /tmp/godot-runtime.log; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi

      - name: Validate the ten-region open world and persistent systems
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          set +e
          timeout 145s "$GODOT" --headless --path . -- --ci-open-world-check > /tmp/godot-open-world.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/godot-open-world.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed|CI OPEN WORLD CHECK:" /tmp/godot-open-world.log; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          grep -q "CI OPEN WORLD CHECK OK" /tmp/godot-open-world.log

      - name: Validate V6 terrain, authored details, camera and compact HUD
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          set +e
          timeout 150s "$GODOT" --headless --path . -- --ci-visual-quality-check > /tmp/godot-visual-quality.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/godot-visual-quality.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed|CI VISUAL QUALITY CHECK:" /tmp/godot-visual-quality.log; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          grep -q "CI VISUAL QUALITY CHECK OK" /tmp/godot-visual-quality.log

      - name: Validate V8.4 water, swimming, CHK HERO and safe spawn
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          set +e
          timeout 155s xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . -- --ci-critical-bug-check > /tmp/godot-critical.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/godot-critical.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed|CI CRITICAL BUG CHECK:" /tmp/godot-critical.log; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          grep -q "CI CRITICAL BUG CHECK OK" /tmp/godot-critical.log

      - name: Validate V8.4 compact tutorial and mobile safe areas
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          set +e
          timeout 155s xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . -- --ci-mobile-ui-check > /tmp/godot-mobile-ui.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/godot-mobile-ui.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed|CI MOBILE UI CHECK:" /tmp/godot-mobile-ui.log; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          grep -q "CI MOBILE UI CHECK OK" /tmp/godot-mobile-ui.log

      - name: Validate a real touchscreen press, movement and walk cycle
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          set +e
          timeout 135s xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . -- --ci-walk-check > /tmp/godot-touch.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/godot-touch.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed|CI TOUCH CHECK:" /tmp/godot-touch.log; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "Touch movement test exited with status $STATUS"
            exit "$STATUS"
          fi
          grep -q "CI TOUCH CHECK OK" /tmp/godot-touch.log

      - name: Capture the fully loaded interface
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          mkdir -p build/validation
          rm -f build/validation/HUD-Carte-Portrait.png
          set +e
          timeout 140s xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . -- --ci-hud-shot > /tmp/godot-visual.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/godot-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed|CI HUD capture failed|CI HUD capture timed out" /tmp/godot-visual.log; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          grep -q "CI HUD capture saved" /tmp/godot-visual.log
          test -s build/validation/HUD-Carte-Portrait.png

      - name: Capture the rebuilt coastline and water
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          rm -f build/validation/Eau-Littoral-Nage.png
          set +e
          timeout 145s xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . -- --ci-water-shot > /tmp/godot-water-shot.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/godot-water-shot.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed|CI WATER capture failed" /tmp/godot-water-shot.log; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          grep -q "CI WATER capture saved" /tmp/godot-water-shot.log
          test -s build/validation/Eau-Littoral-Nage.png

      - name: Capture the compact tutorial and mobile controls
        run: |
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          rm -f build/validation/Interface-Mobile-Tutoriel.png
          set +e
          timeout 145s xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . -- --ci-mobile-ui-shot > /tmp/godot-mobile-ui-shot.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/godot-mobile-ui-shot.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Assertion failed|CI MOBILE UI capture failed" /tmp/godot-mobile-ui-shot.log; then
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          grep -q "CI MOBILE UI capture saved" /tmp/godot-mobile-ui-shot.log
          test -s build/validation/Interface-Mobile-Tutoriel.png

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Godot project
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          export_debug: true
          use_preset_export_path: true
          presets_to_export: Android
          cache: true

      - name: Verify and normalise APK
        run: |
          APK_PATH="$(find build -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          unzip -l "$APK_PATH" | grep -q 'classes.dex'
          unzip -l "$APK_PATH" | grep -q 'lib/arm64-v8a/libgodot_android.so'
          unzip -l "$APK_PATH" | grep -q 'assets/carte monde.png'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/main_mobile_final.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/main_visual_overhaul_v6.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/main_coastal_presentation_v7.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/main_critical_fixes_v8.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/main_water_portrait_polish_v8_1.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/main_portrait_front_v8_2.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/main_mobile_ui_polish_v8_3.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/main_spawn_safety_v8_4.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/procedural_animator.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/ci_walk_animation_check.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/ci_open_world_check.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/ci_visual_quality_check.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/ci_critical_bug_check.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/ci_water_capture.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/ci_mobile_ui_check.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/ci_mobile_ui_capture.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/world/world_clock_weather.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/scripts/game/adventure_progress.gdc'
          unzip -l "$APK_PATH" | grep -q 'assets/assets/characters/chk_hero.png'
          unzip -l "$APK_PATH" | grep -q 'assets/assets/audio/generated/sous_marin.ogg'
          unzip -l "$APK_PATH" | grep -q 'assets/generated_models/hero_knight.glb'
          mkdir -p build/final
          TARGET="build/final/ZeldaLike-CHK-Hero-OpenWorld-V8-4-debug.apk"
          if [ "$(realpath "$APK_PATH")" != "$(realpath -m "$TARGET")" ]; then
            cp "$APK_PATH" "$TARGET"
          fi
          test -s "$TARGET"
          sha256sum "$TARGET" | tee build/final/SHA256.txt
          ls -lh "$TARGET"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: ZeldaLike-CHK-Hero-OpenWorld-V8-4-Android
          path: |
            build/final/ZeldaLike-CHK-Hero-OpenWorld-V8-4-debug.apk
            build/final/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload visual validation
        uses: actions/upload-artifact@v7
        with:
          name: ZeldaLike-CHK-Hero-OpenWorld-V8-4-Validation
          path: build/validation/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated Blender models
        uses: actions/upload-artifact@v7
        with:
          name: ZeldaLike-CHK-Hero-OpenWorld-V8-4-Models
          path: generated_models/*.glb
          if-no-files-found: error
          retention-days: 30
