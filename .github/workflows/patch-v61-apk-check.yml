name: Patch V6.1 APK Check

on:
  push:
    branches: ["v6.1-physics-world"]

permissions:
  contents: write

jobs:
  patch-apk-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v6.1-physics-world

      - name: Replace fragile unzip verification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-android.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          replaced = False
          index = 0
          while index < len(lines):
              line = lines[index]
              if line.strip() == 'unzip -t "$APK_PATH" >/dev/null':
                  output.append('          file "$APK_PATH"')
                  output.append('          sha256sum "$APK_PATH"')
                  output.append('          python3 tools/verify_apk.py "$APK_PATH" /tmp/apk-entries.txt')
                  index += 6
                  replaced = True
                  continue
              output.append(line)
              index += 1
          if not replaced:
              raise SystemExit('APK verification block not found')
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-android.yml
          git commit -m "Fix V6.1 APK archive verification"
          git push origin HEAD:v6.1-physics-world
