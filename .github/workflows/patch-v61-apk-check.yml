name: Patch V6.1 APK Check

on:
  push:
    branches: ["v6.1-physics-world"]

permissions:
  contents: write

jobs:
  patch-apk-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v6.1-physics-world

      - name: Replace fragile unzip verification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-android.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          unzip -t "$APK_PATH" >/dev/null
          unzip -Z1 "$APK_PATH" | tee /tmp/apk-entries.txt
          grep -qx 'classes.dex' /tmp/apk-entries.txt
          grep -qx 'lib/arm64-v8a/libgodot_android.so' /tmp/apk-entries.txt
          ASSET_COUNT="$(grep -c '^assets/' /tmp/apk-entries.txt || true)"
          test "$ASSET_COUNT" -gt 0
'''
          new = '''          file "$APK_PATH"
          sha256sum "$APK_PATH"
          python3 tools/verify_apk.py "$APK_PATH" /tmp/apk-entries.txt
'''
          if old not in text:
              raise SystemExit('APK verification block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-android.yml
          git commit -m "Fix V6.1 APK archive verification"
          git push origin HEAD:v6.1-physics-world
